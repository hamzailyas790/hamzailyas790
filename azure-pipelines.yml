trigger:
  - master

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self
  displayName: 'Checkout source code'

- script: |
    echo "Current directory:"
    pwd
    echo "Files:"
    ls -la
    echo "Recursive list:"
    ls -R
  displayName: "Debug — Show workspace"

- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: npm install
  displayName: 'Install dependencies'

- script: npm test
  displayName: 'Run tests'
